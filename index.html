<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lokal</title>
<meta name="description" content="Toutes les sorties autour de toi en Belgique, sur une carte.">
<style>
  :root { --bg: #FFFFFF; --fg: #111111; --muted: #5B6170; --accent: #D10F5C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0A1640; --fg: #FFFFFF; --muted: #AEB7D6; --accent: #FF2E8A; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 16px; }
  .logo { font-weight: 900; font-style: italic; font-size: 44px; letter-spacing: -1px; }
  .logo span { color: var(--accent); }
  p { color: var(--muted); }
  a.btn { display: block; text-align: center; text-decoration: none; font-weight: 800; border-radius: 14px; padding: 14px 16px; margin: 24px 0; background: var(--accent); color: #FFFFFF; }
</style>
</head>
<body>
<main>
  <div class="logo">Lokal<span>.</span></div>
  <h1>Ton agenda Lokal dans ta poche.</h1>
  <p>Soirées, fêtes de village, culture, sport, jeux : toutes les sorties autour de toi en Belgique, sur une carte.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=be.lokalapp.app">Installer Lokal (Android)</a>
  <p>Bientôt sur iPhone. Contact : contact@lokalapp.be</p>
</main>
</body>
</html>
